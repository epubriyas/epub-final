name: epubtrans-v2
x-app: &app
  image: epubtrans-v2:local
  build:
    context: .
    args:
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?Set the canonical HTTPS origin}
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-epubtrans}:${POSTGRES_PASSWORD:?Set a strong database password}@postgres:5432/${POSTGRES_DB:-epubtrans}
    PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set a strong Payload secret}
    PREVIEW_SECRET: ${PREVIEW_SECRET:?Set a distinct preview secret}
    NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
    PRIVATE_UPLOAD_DIR: /app/private-uploads
    TRUST_NGINX_PROXY: 'true'
    SMTP_HOST: ${SMTP_HOST:-}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    MANAGER_EMAIL: ${MANAGER_EMAIL:-riyastech001@gmail.com}
    RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    QUOTE_EMAIL_FROM: ${QUOTE_EMAIL_FROM:-EPUBTRANS <info@epubtrans.com>}
    SMTP_PORT: ${SMTP_PORT:-465}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_ASSISTANT_MODEL: ${GEMINI_ASSISTANT_MODEL:-gemini-3.5-flash-lite}
    ASSISTANT_DAILY_REQUEST_LIMIT: ${ASSISTANT_DAILY_REQUEST_LIMIT:-300}
    TRANSLATION_CACHE_DIR: /app/translation-cache
    TRANSLATION_DAILY_CHARACTER_LIMIT: ${TRANSLATION_DAILY_CHARACTER_LIMIT:-250000}
  volumes:
    - media:/app/public/media
    - private_uploads:/app/private-uploads
    - translations:/app/translation-cache
  networks: [internal, outbound]
  depends_on:
    postgres:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-epubtrans}
      POSTGRES_USER: ${POSTGRES_USER:-epubtrans}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    <<: *app
    restart: unless-stopped
  migrate:
    <<: *app
    profiles: [tools]
    command: ['node', 'node_modules/payload/bin.js', 'migrate']
    restart: 'no'
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      SITE_HOST: ${SITE_HOST:?Set the domain without protocol}
      NGINX_ENVSUBST_FILTER: '^SITE_HOST$'
    volumes:
      - ./deployment/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${CERTIFICATE_DIRECTORY:-/etc/letsencrypt}:/etc/letsencrypt:ro
    networks: [internal, public]
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  database:
  media:
  private_uploads:
  translations:
networks:
  internal:
    internal: true
  public:
  outbound:
